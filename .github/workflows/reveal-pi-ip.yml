name: Reveal PI IP (temporary)

on:
  workflow_dispatch:

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - name: Create file with PI IP from secret
        run: |
          echo "${{ secrets.RPI_SSH_HOST }}" > pi-ip.txt
          echo "Wrote artifact"
      - name: Upload artifact (pi-ip)
        uses: actions/upload-artifact@v4
        with:
          name: pi-ip
          path: pi-ip.txt 
