name: Deploy to Raspberry Pi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to RaspberryPi via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load SSH key for Action → Pi
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.RPI_SSH_PRIVATE_KEY }}

      - name: Add Raspberry Pi to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.RPI_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull latest code and restart service
        run: |
          ssh -o StrictHostKeyChecking=yes -p ${{ secrets.RPI_SSH_PORT }} ${{ secrets.RPI_SSH_USER }}@${{ secrets.RPI_SSH_HOST }} << 'EOF'
            git config --global user.name "deploybot"
            git config --global user.email "deploybot@raspberrypi.local"
            
            sudo git config --global --add safe.directory /home/shared/projects/noxis
            cd /home/shared/projects/noxis
            
            # HTTPS remote mit Token verwenden
            sudo git remote set-url origin https://${{ secrets.GITHUB_PAT }}@github.com/killuari/noxis.git
            sudo git pull origin main
            
            # Remote wieder ohne Token setzen (Sicherheit)
            sudo git remote set-url origin https://github.com/killuari/noxis.git
            
            sudo systemctl restart noxis
          EOF
